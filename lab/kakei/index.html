<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家計ひとめ</title>
<meta name="description" content="金額を入れて項目を押すだけの家計簿。今月の合計と予算の残り、項目ごとの使い道がひと目でわかります。">
<meta name="theme-color" content="#eef2f1">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="shell">
  <header class="bar">
    <p class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>家計ひとめ</p>
    <nav class="month" aria-label="月の切りかえ">
      <button type="button" id="prev" aria-label="前の月">‹</button>
      <h1 id="month">—</h1>
      <button type="button" id="next" aria-label="次の月">›</button>
    </nav>
  </header>

  <section class="summary" aria-live="polite">
    <p class="label">今月の支出</p>
    <p class="total"><span class="yen">¥</span><span id="total">0</span></p>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <div class="facts">
      <p><span>予算</span><b id="budget-v">—</b></p>
      <p><span id="left-l">残り</span><b id="left">—</b></p>
      <p><span>1日あたりの目安</span><b id="perday">—</b></p>
    </div>
    <button type="button" class="ghost" id="edit-budget">予算を設定する</button>
    <form class="budget-form" id="budget-form" hidden>
      <label for="budget-in">ひと月の予算（円）</label>
      <div class="inline"><input id="budget-in" type="text" inputmode="numeric" autocomplete="off" placeholder="例：60000"><button type="submit" class="solid">保存</button></div>
    </form>
  </section>

  <section class="entry" aria-labelledby="h-entry">
    <h2 id="h-entry">記録する</h2>
    <div class="amount-row">
      <label for="amount" class="sr">金額（円）</label>
      <span class="yen-big" aria-hidden="true">¥</span>
      <input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0" maxlength="9">
    </div>
    <div class="sub-row">
      <label for="date">日付</label><input id="date" type="date">
      <label for="memo" class="sr">メモ</label><input id="memo" type="text" maxlength="30" placeholder="メモ（なくても可）">
    </div>
    <p class="hint">金額を入れて、項目を押すと記録されます。</p>
    <div class="cats" id="cats"></div>
    <p class="toast" id="toast" role="status"></p>
  </section>

  <section aria-labelledby="h-cat">
    <h2 id="h-cat">項目ごと</h2>
    <ul class="bars" id="bars"></ul>
  </section>

  <section aria-labelledby="h-list">
    <h2 id="h-list">日ごとの記録</h2>
    <div id="list"></div>
  </section>

  <footer class="foot">
    <p>作った人：App World Lab（App Worldの運営）</p>
    <p>記録はこの端末の中だけに保存され、どこにも送られません。</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
</div>
<script src="app.js"></script>
</body></html>
