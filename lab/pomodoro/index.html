<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポモドーロ箱</title>
<meta name="description" content="キッチンタイマーのような集中タイマー。集中と休憩を交互に計り、終わるたびにやったことを一言残せます。">
<meta name="theme-color" content="#EFE5D3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221B17" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポモドーロ箱">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="shell">
  <header class="bar">
    <h1>ポモドーロ箱</h1>
    <a class="home" href="../">App World Lab</a>
    <p class="lead">スタートひとつで、集中と休憩を交互に計ります。</p>
  </header>

  <main>
    <section class="box" id="box" aria-label="タイマー">
      <div class="screws" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="plate">
        <svg class="dial" id="dial" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="dial-bg" cx="110" cy="110" r="104"/>
          <g id="ticks"></g>
          <path id="wedge" class="wedge" d=""/>
          <circle class="hub" cx="110" cy="110" r="30"/>
          <g id="knob" class="knob"><rect x="104" y="84" width="12" height="52" rx="6"/></g>
        </svg>
        <div class="lcd" role="timer" aria-label="残り時間">
          <span class="lcd-mode" id="mode">集中</span>
          <span class="lcd-time" id="clock">25:00</span>
          <span class="lcd-cycle" id="cycle"></span>
        </div>
      </div>

      <div class="lens" role="group" aria-label="集中する長さ">
        <button type="button" class="key len" data-min="15" aria-pressed="false">15<small>分</small></button>
        <button type="button" class="key len" data-min="25" aria-pressed="true">25<small>分</small></button>
        <button type="button" class="key len" data-min="50" aria-pressed="false">50<small>分</small></button>
      </div>
      <div class="controls">
        <button type="button" class="key big go" id="start">スタート</button>
        <button type="button" class="key small" id="reset">リセット</button>
      </div>
      <p class="status" id="status" aria-live="polite">スタートを押すと、25分の集中がはじまります。</p>
    </section>

    <form class="ticket" id="ask" hidden>
      <h2 id="ask-h">おつかれさまでした</h2>
      <label for="what">何をしましたか？ 一言でどうぞ。</label>
      <input type="text" id="what" maxlength="60" placeholder="企画書の見出しを決めた" autocomplete="off" enterkeyhint="done">
      <button class="key wide" type="submit" id="save-note">記録する</button>
      <button class="link-btn" type="button" id="skip-note">書かずに休憩へ</button>
    </form>

    <section class="ticket" id="rest" hidden aria-labelledby="rest-h">
      <h2 id="rest-h">休憩しましょう</h2>
      <p class="hint" id="rest-hint"></p>
      <div class="rest-keys">
        <button type="button" class="key" id="short">小休憩<small>5分</small></button>
        <button type="button" class="key" id="long">長休憩<small>15分</small></button>
      </div>
      <button type="button" class="link-btn" id="norest">休憩しない</button>
    </section>

    <section class="paper" aria-labelledby="log-h">
      <div class="paper-head">
        <h2 id="log-h">今日の記録</h2>
        <span class="sum" id="sum"></span>
      </div>
      <ol class="log" id="log"></ol>
      <p class="empty" id="empty">集中が終わるたびに、<br>やったことがここに並びます。</p>
      <div class="paper-foot" id="paper-foot">
        <button type="button" class="key small" id="copy">コピー</button>
        <span class="copied" id="copied" aria-live="polite"></span>
      </div>
    </section>

    <section class="paper" aria-labelledby="week-h">
      <div class="paper-head">
        <h2 id="week-h">今週の集中</h2>
        <span class="sum" id="wsum"></span>
      </div>
      <div class="week" id="week" role="img" aria-label="今週の曜日ごとの集中時間"></div>
    </section>
  </main>

  <footer class="foot">
    <p>記録は、この端末にだけ保存されます。</p>
    <p>開発：App World Lab（App World 運営）</p>
    <a href="../">App World Lab</a>
  </footer>
</div>
<script src="own.js"></script>
<script src="app.js"></script>
<script src="../pwa.js"></script>
</body></html>
