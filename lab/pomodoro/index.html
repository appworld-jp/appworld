<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポモドーロ箱</title>
<meta name="description" content="25分ごとに、今やったことを一言だけ記録する集中タイマー。">
<link rel="stylesheet" href="../lab.css">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="wrap">
  <div class="top"><a href="../"><b>App World Lab</b></a><span>試作中</span></div>
  <div>
    <h1>ポモドーロ箱</h1>
    <p class="lead">25分集中したら、やったことを一言だけ残す。1日の終わりに、その一言が並びます。</p>
  </div>

  <section class="card timer" aria-label="タイマー">
    <p class="mode" id="mode">集中</p>
    <p class="clock" id="clock" aria-live="off">25:00</p>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="row center">
      <button class="btn" id="start" type="button">はじめる</button>
      <button class="btn ghost" id="reset" type="button">リセット</button>
    </div>
    <div class="row center lens" role="group" aria-label="集中する長さ">
      <button type="button" data-min="15">15分</button><button type="button" data-min="25" aria-pressed="true">25分</button><button type="button" data-min="50">50分</button>
    </div>
  </section>

  <form class="card ask" id="ask" hidden>
    <label for="what"><b>おつかれさまでした。何をしましたか？</b></label>
    <input type="text" id="what" maxlength="60" placeholder="例：企画書の見出しを決めた" autocomplete="off">
    <div class="row"><button class="btn" type="submit">記録して休憩へ</button><button class="btn ghost" type="button" id="skip">記録しない</button></div>
  </form>

  <section class="card" aria-labelledby="log-h">
    <div class="row between"><h2 id="log-h">今日の記録</h2><span class="note" id="sum"></span></div>
    <ol class="log" id="log"></ol>
    <p class="note" id="empty">まだ記録はありません。最初の25分をはじめましょう。</p>
    <div class="row"><button class="btn ghost" type="button" id="copy">一覧をコピー</button><span class="note" id="copied" aria-live="polite"></span></div>
  </section>

  <p class="made">作った人：App World Lab（App Worldの運営）。記録はこの端末の中だけに保存され、どこにも送られません。</p>
</div>
<script src="app.js"></script>
</body></html>
