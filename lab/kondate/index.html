<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こんだて帖</title>
<meta name="description" content="家にある食材を選ぶと、手持ちをいちばん使える晩ごはんを3品えらび、足りない食材の買い物リストもまとめます。">
<meta name="theme-color" content="#f6ecdc">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
  <header class="mast">
    <svg class="pot" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 28h44v14a14 14 0 0 1-14 14H24a14 14 0 0 1-14-14z" fill="currentColor"/><rect x="6" y="24" width="52" height="6" rx="3" fill="currentColor"/><rect x="26" y="16" width="12" height="6" rx="3" fill="currentColor"/><path d="M22 12c0-3 3-3 3-6M32 12c0-3 3-3 3-6M42 12c0-3 3-3 3-6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
    <div>
      <p class="kicker">きょうの晩ごはん</p>
      <h1>こんだて帖</h1>
    </div>
  </header>
  <p class="lead">冷蔵庫にあるものに印をつけると、手持ちをいちばん使える料理を3品えらびます。足りないものは買い物リストにまとめます。</p>

  <section class="pantry" aria-labelledby="h-pantry">
    <div class="sec-head">
      <h2 id="h-pantry"><span class="num">一</span>家にある食材</h2>
      <button type="button" class="link" id="clear">選択をはずす</button>
    </div>
    <p class="hint">しょうゆ・みそ・砂糖・塩・油などの調味料は、家にある前提です。</p>
    <div id="groups"></div>
  </section>

  <div class="dock">
    <button type="button" class="go" id="go"><span id="go-label">食材を選んでください</span></button>
  </div>

  <section class="results" aria-labelledby="h-res">
    <div class="sec-head">
      <h2 id="h-res"><span class="num">二</span>きょうの3品</h2>
      <button type="button" class="link" id="more" hidden>別の3品を見る</button>
    </div>
    <div id="out" aria-live="polite">
      <div class="empty" id="empty">
        <p>食材を選んで「献立を考える」を押すと、ここに3品の作り方が並びます。</p>
        <button type="button" class="sample" id="sample">例：たまねぎ・にんじん・じゃがいも・豚肉・卵で試す</button>
      </div>
    </div>
  </section>

  <section class="shop" id="shop" hidden aria-labelledby="h-shop">
    <div class="sec-head">
      <h2 id="h-shop"><span class="num">三</span>買い物リスト</h2>
      <button type="button" class="link" id="copy">文字でコピー</button>
    </div>
    <ul class="memo" id="memo"></ul>
    <p class="hint" id="copy-msg" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <p>作った人：App World Lab（App Worldの運営）</p>
    <p>選んだ食材はこの端末の中だけに保存され、どこにも送られません。</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
</div>
<script src="recipes.js"></script>
<script src="app.js"></script>
</body></html>
