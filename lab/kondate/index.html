<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こんだて帖</title>
<meta name="description" content="冷蔵庫にある食材から、今夜の晩ごはんを3品。足りないものは買い物リストに。">
<meta name="theme-color" content="#f6ecdc">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
  <header class="mast">
    <svg class="pot" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 28h44v14a14 14 0 0 1-14 14H24a14 14 0 0 1-14-14z" fill="currentColor"/><rect x="6" y="24" width="52" height="6" rx="3" fill="currentColor"/><rect x="26" y="16" width="12" height="6" rx="3" fill="currentColor"/><path d="M22 12c0-3 3-3 3-6M32 12c0-3 3-3 3-6M42 12c0-3 3-3 3-6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
    <div>
      <p class="kicker">きょうの晩ごはん</p>
      <h1>こんだて帖</h1>
    </div>
  </header>
  <p class="lead">冷蔵庫にあるものを選ぶだけで、今夜の3品が決まります。</p>

  <section class="pantry" aria-labelledby="h-pantry">
    <div class="sec-head">
      <h2 id="h-pantry"><span class="num">一</span>家にある食材</h2>
      <button type="button" class="link" id="clear">すべて解除</button>
    </div>
    <p class="hint">しょうゆ・みそ・砂糖などの調味料は、選ばなくて大丈夫です。</p>
    <div id="groups"></div>
  </section>

  <div class="dock">
    <button type="button" class="go" id="go"><span id="go-label">食材を選んでください</span></button>
  </div>

  <section class="results" aria-labelledby="h-res">
    <div class="sec-head">
      <h2 id="h-res"><span class="num">二</span>きょうの3品</h2>
      <button type="button" class="link" id="more" hidden>ほかの3品</button>
    </div>
    <div id="out" aria-live="polite">
      <div class="empty" id="empty">
        <p>ここに、今夜の3品と作り方が出ます。</p>
        <button type="button" class="sample" id="sample">お試し：たまねぎ・にんじん・じゃがいも・豚肉・卵</button>
      </div>
    </div>
  </section>

  <section class="shop" id="shop" hidden aria-labelledby="h-shop">
    <div class="sec-head">
      <h2 id="h-shop"><span class="num">三</span>買い物リスト</h2>
      <button type="button" class="link" id="copy">コピー</button>
    </div>
    <ul class="memo" id="memo"></ul>
    <p class="hint" id="copy-msg" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <p>選んだ食材は、この端末にだけ保存されます。</p>
    <p>開発：App World Lab（App World 運営）</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
</div>
<script src="recipes.js"></script>
<script src="app.js"></script>
</body></html>
