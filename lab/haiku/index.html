<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>俳句カメラ</title>
<meta name="description" content="写真に自分で詠んだ一句を添えて、縦書きの俳句カードに。音の数を数えながら詠めて、画像で保存できます。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1B1F33">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="wrap">
  <header class="head">
    <a class="back" href="../">App World Lab</a>
    <h1><span>俳句</span><span>カメラ</span></h1>
    <p class="lead">写真に一句添えて、縦書きの俳句カードに。</p>
  </header>

  <ol class="steps">
    <li class="step">
      <h2><span class="no">一</span>写真を選ぶ</h2>
      <label class="pick" id="pickLabel">
        <input type="file" id="file" accept="image/*">
        <span class="pick-t" id="pickT">写真を選ぶ</span>
        <span class="pick-s">写真なしでも作れます。<br>写真は保存も送信もしません。</span>
      </label>
      <p class="err" id="fileErr" role="alert"></p>
    </li>

    <li class="step">
      <h2><span class="no">二</span>季語を選ぶ</h2>
      <div class="seasons" role="radiogroup" aria-label="季節" id="seasons"></div>
      <div class="kigo" id="kigo" role="radiogroup" aria-label="季語"></div>
      <p class="kigo-now" id="kigoNow" aria-live="polite"></p>
    </li>

    <li class="step">
      <h2><span class="no">三</span>五・七・五を詠む</h2>
      <p class="help">ひらがなで書くと、音の数を自動で数えます。漢字を使った行は、下の「よみ」に読みを入れてください。「ゃゅょ」は数えず、「っ」「ー」「ん」は1音です。</p>
      <button class="ins sample" type="button" id="sample">例を入れてみる（芭蕉「古池や」）</button>
      <div class="lines" id="lines"></div>
      <p class="kcheck" id="kcheck" aria-live="polite"></p>
      <label class="name"><span>名前（任意）</span><input type="text" id="author" maxlength="8" autocomplete="off" placeholder="さくら"></label>
    </li>
  </ol>

  <section class="preview" aria-labelledby="pvH">
    <h2 id="pvH" class="pv-h">できあがり</h2>
    <div class="card" id="card">
      <div class="card-photo" id="cardPhoto"><span class="card-empty">写真</span></div>
      <div class="card-paper">
        <p class="card-haiku" id="cardHaiku"></p>
        <p class="card-meta" id="cardMeta"></p>
        <span class="card-seal" aria-hidden="true">句</span>
      </div>
    </div>
    <div class="acts">
      <button class="btn" type="button" id="export">画像で保存</button>
    </div>
    <p class="err" id="expErr" role="alert"></p>
    <figure class="out" id="out" hidden>
      <img id="outImg" alt="書き出した俳句カードの画像">
      <figcaption>ダウンロードされないときは、画像を長押しして保存してください。</figcaption>
    </figure>
  </section>

  <footer class="foot">
    <p>句は自動では作りません。詠むのはあなたです。</p>
    <p>詠んだ句は、この端末にだけ保存されます。</p>
    <p>開発：App World Lab（App World 運営）</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
</div>
<script src="../img.js"></script>
<script src="kigo.js"></script>
<script src="app.js"></script>
</body></html>
