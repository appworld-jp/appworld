<div class="room">
  <header class="title">
    <svg class="moon" viewBox="0 0 40 40" aria-hidden="true"><path d="M26 4a16 16 0 1 0 10 26A13 13 0 0 1 26 4z" fill="#f2d27a"/></svg>
    <h1>えほんメーカー</h1>
    <p>3つ えらぶと、ねるまえに よむ えほんが できるよ。</p>
  </header>

  <form id="maker" class="maker" novalidate>
    <fieldset class="step">
      <legend><span class="n">1</span>しゅじんこうは だれ？</legend>
      <div class="choices" id="c-hero"></div>
    </fieldset>
    <fieldset class="step">
      <legend><span class="n">2</span>どこの おはなし？</legend>
      <div class="choices wide" id="c-place"></div>
    </fieldset>
    <fieldset class="step">
      <legend><span class="n">3</span>すきなものは なに？</legend>
      <div class="choices" id="c-thing"></div>
    </fieldset>
    <button type="submit" class="make" id="make">えほんを つくる</button>
    <button type="button" class="omakase" id="omakase">まよったら、おまかせで つくる</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <section class="reader" id="reader" hidden aria-roledescription="えほん" aria-labelledby="book-title">
    <h2 class="sr" id="book-title">えほん</h2>
    <div class="spread">
      <div class="pic" aria-hidden="true">
        <svg id="scene" viewBox="0 0 320 200"></svg>
      </div>
      <div class="words">
        <p class="page-no" id="page-no"></p>
        <p class="text" id="text" aria-live="polite"></p>
      </div>
    </div>
    <div class="nav">
      <button type="button" class="turn" id="prev" aria-label="まえのページ">‹</button>
      <ol class="dots" id="dots" aria-hidden="true"></ol>
      <button type="button" class="turn" id="next" aria-label="つぎのページ">›</button>
    </div>
    <div class="tools">
      <button type="button" class="tool" id="read">こえで よむ</button>
      <button type="button" class="tool" id="another">べつの おはなし</button>
      <button type="button" class="tool" id="back">えらびなおす</button>
    </div>
  </section>

  <footer class="foot">
    <p class="parent">おうちの方へ：お話は、人が書いた5つのお話に、選んだ主人公や場所を当てはめて作ります。「こえで よむ」を押すと、端末の音声で読み上げます。</p>
    <p>選んだものは、この端末にだけ保存されます。</p>
    <p>開発：App World Lab（App World 運営）</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
