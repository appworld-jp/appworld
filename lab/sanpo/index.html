<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>さんぽログ</title>
<meta name="description" content="歩いた時間と見つけたものを残すさんぽ日記。歩いた日はカレンダーにスタンプが押され、続けるほど緑が濃くなります。">
<meta name="theme-color" content="#F1E8D3">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
  <header class="head">
    <h1><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26c4-12 10-18 20-20-1 10-7 17-20 20z"/><path class="vein" d="M7 25L22 10"/></svg>さんぽログ</h1>
    <p class="streak" id="streakBadge" aria-live="polite"></p>
  </header>
  <p class="lead"><span class="nw">歩いた日にスタンプが押されて、</span><span class="nw">カレンダーが少しずつ緑になります。</span></p>

  <section class="theme" aria-labelledby="themeLbl">
    <p class="theme-lbl" id="themeLbl">今日のおさんぽテーマ</p>
    <p class="theme-txt" id="themeTxt"></p>
    <button type="button" class="ghost" id="themeNext">ほかのテーマ</button>
  </section>

  <section class="walk" id="walk" aria-label="さんぽタイマー">
    <p class="clock" id="clock" aria-live="off">0:00</p>
    <p class="clock-sub" id="clockSub">出かけるときに押すと、歩いた時間を計ります。</p>
    <button type="button" class="primary" id="startBtn">さんぽに出かける</button>
    <button type="button" class="primary home" id="stopBtn" hidden>ただいま</button>
    <button type="button" class="ghost" id="cancelBtn" hidden>取り消す</button>
    <button type="button" class="textbtn" id="manualBtn">歩いたあとで記録する</button>
  </section>

  <form class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">おかえりなさい</h2>
    <div class="two">
      <label>日付<input type="date" id="fDate" required></label>
      <label>歩いた時間（分）<input type="number" id="fMin" min="1" max="600" inputmode="numeric" required></label>
    </div>
    <fieldset><legend>見たもの（いくつでも）</legend><div class="tags" id="fTags"></div></fieldset>
    <fieldset><legend>気分</legend><div class="moods" id="fMood"></div></fieldset>
    <label class="check"><input type="checkbox" id="fTheme"><span>今日のテーマもできた<span class="thm" id="fThemeTxt"></span></span></label>
    <label>ひとこと（140字まで）<textarea id="fNote" maxlength="140" rows="3" placeholder="例：川沿いのイチョウが黄色くなりはじめていた。"></textarea></label>
    <p class="err" id="fErr" role="alert"></p>
    <div class="row"><button type="submit" class="primary small">記録する</button><button type="button" class="ghost" id="fCancel">キャンセル</button></div>
  </form>

  <section class="card" aria-labelledby="calTitle">
    <div class="calhead">
      <button type="button" class="nav" id="calPrev" aria-label="前の月">‹</button>
      <h2 id="calTitle"></h2>
      <button type="button" class="nav" id="calNext" aria-label="次の月">›</button>
    </div>
    <div class="cal" id="cal" role="group" aria-labelledby="calTitle"></div>
    <p class="legend" aria-hidden="true"><span class="lth"><i class="th"></i>テーマ達成</span>短い<i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>長い</p>
    <dl class="totals" id="totals"></dl>
    <p class="favs" id="favs"></p>
  </section>

  <section class="card" aria-labelledby="jTitle">
    <h2 id="jTitle">さんぽ日記</h2>
    <ol class="journal" id="journal"></ol>
    <p class="empty" id="jEmpty">歩いた日の記録が、ここに日記のように並びます。まずは家のまわりを10分だけ歩いてみませんか？</p>
  </section>

  <footer class="foot">
    <p>さんぽの記録は、この端末にだけ保存されます。</p>
    <p>開発：App World Lab（App World 運営）</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
</div>
<script src="themes.js"></script>
<script src="app.js"></script>
</body></html>
