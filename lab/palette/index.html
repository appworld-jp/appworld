<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おえかき色見本</title>
<meta name="description" content="写真から3〜8色の配色を取り出して、色見本カードにします。HEXとRGBのコピー、気に入った色の固定と作り直し、PNG画像での保存ができます。">
<meta name="theme-color" content="#F6F2EA">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
  <header class="head">
    <p class="kicker">COLOR CHIPS</p>
    <h1>おえかき色見本</h1>
    <p class="lead">好きな写真から、絵やデザインに使える色を取り出して、色見本カードにします。</p>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*">
    <span class="drop-art" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="drop-t">写真を選ぶ</span>
    <span class="drop-s">ここに写真をドロップしても選べます</span>
  </label>
  <p class="or"><button type="button" class="textbtn" id="sample">見本の絵で試してみる</button></p>
  <p class="msg" id="loadMsg" role="alert"></p>

  <section class="work" id="work" hidden>
    <figure class="photo"><img id="preview" alt="選んだ写真"></figure>

    <div class="controls">
      <div class="ctl"><span class="ctl-l" id="cntLbl">色の数</span><div class="seg" id="countSeg" role="group" aria-labelledby="cntLbl"></div></div>
      <div class="ctl"><span class="ctl-l" id="sortLbl">並べ方</span><div class="seg" id="sortSeg" role="group" aria-labelledby="sortLbl"></div></div>
    </div>

    <ol class="chips" id="chips" aria-live="polite" aria-label="取り出した色"></ol>
    <p class="hint">気に入った色は「固定」すると、「作り直す」を押しても残ります。</p>

    <div class="actions">
      <button type="button" class="btn ink" id="regen">作り直す</button>
      <button type="button" class="btn" id="copyAll">色コードをまとめてコピー</button>
      <button type="button" class="btn" id="savePng">カードをPNGで保存</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <textarea class="fallback" id="fallback" readonly hidden aria-label="コピー用の色コード"></textarea>
  </section>

  <footer class="foot">
    <p>作った人：App World Lab（App Worldの運営）</p>
    <p>写真はこの端末の中だけで処理され、どこにも送られません。</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
</div>
<script src="../img.js"></script>
<script src="app.js"></script>
</body></html>
