<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>出発から逆算タイマー</title>
<meta name="description" content="家を出る時刻と、それまでにやることを入れるだけ。何時に何を始めればいいかを逆算し、今やることと、おくれ・よゆうを大きく表示します。">
<meta name="theme-color" content="#111214">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head><body>
<main class="board">
  <!-- 計画 -->
  <section id="plan" aria-labelledby="h-app">
    <header class="head">
      <h1 id="h-app">出発から逆算タイマー</h1>
      <p class="lead">出る時刻から逆算して、何時に何を始めればいいかを出します。</p>
    </header>

    <nav class="routines" aria-label="段取りの切りかえ" id="routines"></nav>

    <div class="templates" id="templates" hidden>
      <h2 class="sec">ひな形を選ぶ</h2>
      <div class="tpl-list" id="tpl-list"></div>
      <button type="button" class="link" id="tpl-close">やめる</button>
    </div>

    <div id="editor">
      <div class="target">
        <div class="mode" role="radiogroup" aria-label="時刻の意味">
          <button type="button" role="radio" id="mode-leave" aria-checked="true">家を出る</button>
          <button type="button" role="radio" id="mode-arrive" aria-checked="false">着く</button>
        </div>
        <label class="tgt"><span class="vh" id="tgt-l">時刻</span><input type="time" id="tgt" required aria-describedby="tgt-err"></label>
        <p class="ferr" id="tgt-err"></p>
        <p class="startat" id="startat" aria-live="polite"></p>
      </div>

      <ol class="steps" id="steps" aria-label="やること"></ol>
      <p class="ferr" id="steps-err"></p>
      <button type="button" class="add" id="add-step">＋ やることを追加</button>

      <button type="button" class="go" id="go">はじめる</button>
      <p class="hint">「はじめる」を押すと、今やることと残り時間を大きく表示します。</p>

      <details class="more">
        <summary>この段取りの名前・削除</summary>
        <label class="fld"><span>名前</span><input id="r-name" maxlength="20" autocomplete="off"></label>
        <button type="button" class="link danger" id="r-del">この段取りを削除</button>
      </details>
    </div>

    <section class="move" aria-labelledby="h-move">
      <h2 id="h-move" class="sec">機種変更のとき</h2>
      <p class="hint">段取りはこの端末の中だけにあります。新しい端末へは、ファイルに書き出して読みこんでください。</p>
      <div class="row">
        <button type="button" class="btn" id="export">ファイルに書き出す</button>
        <label class="btn file">ファイルを読みこむ<input type="file" id="import" accept="application/json,.json"></label>
      </div>
      <p class="ferr" id="move-err" role="alert"></p>
    </section>
  </section>

  <!-- 実行中 -->
  <section id="run" aria-labelledby="now-label" hidden>
    <div class="run-top">
      <p class="dep" id="dep"></p>
      <button type="button" class="chime" id="chime" aria-pressed="false">チャイム オフ</button>
    </div>
    <p class="now-label" id="now-label">今やること</p>
    <p class="now" id="now" aria-live="polite"></p>
    <p class="cd" id="cd" aria-live="off"></p>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="prog" id="prog" aria-hidden="true"><div class="segs" id="segs"></div><i class="needle" id="needle"></i></div>
    <div class="run-btns">
      <button type="button" class="go" id="next">できた</button>
      <button type="button" class="btn" id="stop">やめる</button>
    </div>
    <ol class="rows" id="rows" aria-label="この先の予定"></ol>
    <p class="flash" id="flash" role="alert"></p>
  </section>

  <!-- 完了 -->
  <section id="done" aria-labelledby="done-h" hidden>
    <p class="done-mark" aria-hidden="true">●</p>
    <h2 id="done-h" class="done-h"></h2>
    <p class="done-sub" id="done-sub"></p>
    <button type="button" class="go" id="done-back">段取りにもどる</button>
  </section>

  <footer class="foot">
    <p>段取りは、この端末にだけ保存されます。</p>
    <p>開発：App World Lab（App World 運営）</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-t"></span><button type="button" id="toast-undo" hidden>取り消す</button></div>
<script src="app.js"></script>
</body></html>
