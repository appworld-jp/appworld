<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おはなしタイマー</title>
<meta name="description" content="子どもの歯みがきを、お話を聞きながら3分続ける。">
<link rel="stylesheet" href="../lab.css">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="wrap">
  <div class="top"><a href="../"><b>App World Lab</b></a><span>試作中</span></div>
  <div>
    <h1>おはなしタイマー</h1>
    <p class="lead">歯みがきの3分間、お話が少しずつ進みます。30秒ごとに、みがく場所も教えてくれます。</p>
  </div>

  <section class="card stage" aria-live="polite">
    <div class="ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="arc" cx="60" cy="60" r="52"/></svg><span id="time">3:00</span></div>
    <p class="area" id="area">お話をえらんで、はじめよう</p>
    <h2 id="title"></h2>
    <p class="text" id="text"></p>
    <div class="row center">
      <button class="btn" type="button" id="start">はじめる</button>
      <button class="btn ghost" type="button" id="stop" hidden>やめる</button>
    </div>
    <div class="row center">
      <label class="note" for="story">お話</label>
      <select id="story"></select>
      <label class="note voice"><input type="checkbox" id="speak"> 読み上げる</label>
    </div>
  </section>

  <p class="made">作った人：App World Lab（App Worldの運営）。読み上げは端末の音声機能を使います。何もどこにも送られません。</p>
</div>
<script src="stories.js"></script>
<script src="app.js"></script>
</body></html>
