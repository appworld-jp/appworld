<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おはなしタイマー</title>
<meta name="description" content="子どもと使う3分の歯みがきタイマー。30秒ごとにみがく場所を教えて、お話がひと場面ずつ進みます。">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おはなしタイマー">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i></div>
<main class="app">
  <header class="head">
    <h1>おはなし<br class="br">タイマー</h1>
    <p class="lead">3ぷんみがくと、おはなしが1つきけるよ。</p>
  </header>

  <section class="stage" aria-label="タイマー">
    <div class="hero">
      <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="ring-bg" cx="110" cy="110" r="100"/>
        <circle class="ring-fg" id="arc" cx="110" cy="110" r="100"/>
      </svg>
      <span class="burst" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <svg class="pal" id="pal" viewBox="0 0 120 120" aria-hidden="true">
        <g class="pal-body">
          <path class="tooth" d="M28 30c0-16 18-22 32-14 14-8 32-2 32 14 0 20-5 36-9 54-2 10-11 10-13 0l-4-16c-2-6-10-6-12 0l-4 16c-2 10-11 10-13 0-4-18-9-34-9-54z"/>
          <ellipse class="cheek" cx="40" cy="50" rx="6" ry="4"/><ellipse class="cheek" cx="80" cy="50" rx="6" ry="4"/>
          <g class="eyes"><circle cx="47" cy="40" r="4.5"/><circle cx="73" cy="40" r="4.5"/><circle class="shine" cx="48.5" cy="38.5" r="1.4"/><circle class="shine" cx="74.5" cy="38.5" r="1.4"/></g>
          <path class="mouth" d="M51 52q9 9 18 0"/>
          <path class="spark" d="M96 14l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
        </g>
        <g class="brush"><rect x="84" y="62" width="34" height="7" rx="3.5" transform="rotate(-35 84 66)"/><rect class="bristle" x="104" y="44" width="11" height="9" rx="2" transform="rotate(-35 104 48)"/></g>
      </svg>
    </div>
    <p class="time" id="time" aria-hidden="true">3:00</p>
    <ol class="stars" id="stars" aria-hidden="true"></ol>

    <div class="where" id="where-box">
      <svg class="mouth-map" id="map" viewBox="0 0 200 174" role="img" aria-labelledby="where"></svg>
      <p class="where-text" id="where" aria-live="polite"></p>
    </div>

    <div class="controls">
      <button type="button" class="big go" id="start"><span>はじめる</span></button>
      <button type="button" class="big pause" id="pause" hidden><span>ちょっとまって</span></button>
      <button type="button" class="small" id="stop" hidden>やめる</button>
    </div>
  </section>

  <section class="story" aria-labelledby="title">
    <p class="story-label" id="part-label">きょうのおはなし</p>
    <h2 id="title"></h2>
    <p class="story-text" id="text" aria-live="polite"></p>
  </section>

  <section class="pick" id="pick" aria-labelledby="h-pick">
    <h2 id="h-pick">おはなしをえらぶ</h2>
    <div class="books" id="books" role="radiogroup" aria-labelledby="h-pick"></div>
    <label class="switch" id="speak-wrap"><input type="checkbox" id="speak"><span class="knob" aria-hidden="true"></span><span>こえでよむ</span></label>
    <p class="count" id="count"></p>
  </section>

  <footer class="foot">
    <p class="parent">おうちの方へ：30秒ごとに、上の歯の表側→裏側→かむ面、下の歯の表側→裏側→かむ面の順に案内します。「こえでよむ」をオンにすると、端末の音声で読み上げます。</p>
    <p>がんばった回数は、この端末にだけ保存されます。</p>
    <p>開発：App World Lab（App World 運営）</p>
    <p><a href="../">App World Lab</a></p>
  </footer>
</main>
<script src="stories.js"></script>
<script src="freechips.js"></script>
<script src="app.js"></script>
<script src="../pwa.js"></script>
</body></html>
