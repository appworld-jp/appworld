# Listing request form (GitHub issue form). Copy to .github/ISSUE_TEMPLATE/
# in Shipyard's own public repository at launch. Everything entered here is
# public on GitHub, so it asks for nothing private.
name: 作品を掲載する
description: AIで作ったアプリやWebサービスを、Shipyardに無料で掲載します
title: "掲載申請: "
labels: ["listing"]
body:
  - type: markdown
    attributes:
      value: |
        入力内容はすべて公開されます。メールアドレスなどの個人情報は記入しないでください。
        送信後に自動チェックが行われ、結果がこのページにコメントされます。
  - type: input
    id: name
    attributes: {label: 作品名, description: 30文字以内}
    validations: {required: true}
  - type: input
    id: tagline
    attributes: {label: 一言説明, description: 40文字以内（例：冷蔵庫の写真から、今夜の献立を3つ提案）}
    validations: {required: true}
  - type: textarea
    id: description
    attributes: {label: 説明文, description: 600文字以内。誰のどんな困りごとを解決するアプリか、を書いてください}
    validations: {required: true}
  - type: dropdown
    id: platform
    attributes: {label: 対応, options: [iPhone, Android, Web]}
    validations: {required: true}
  - type: input
    id: url
    attributes:
      label: リンク
      description: iPhoneはApp Store、AndroidはGoogle Playの作品ページ、Webはhttpsの公式サイトのURL。短縮URLやファイルの直接ダウンロードは使えません
    validations: {required: true}
  - type: dropdown
    id: category
    attributes: {label: ジャンル, options: [仕事・効率化, 暮らし, 学び, 健康・運動, 創作, 開発者向け, 遊び]}
    validations: {required: true}
  - type: checkboxes
    id: ai_tools
    attributes:
      label: 使用したAI（1つ以上）
      options:
        - label: Claude Code
        - label: Cursor
        - label: Codex
        - label: GitHub Copilot
        - label: Gemini
        - label: Windsurf
        - label: v0
        - label: Bolt
        - label: Lovable
        - label: Replit
        - label: その他
  - type: input
    id: maker_name
    attributes: {label: 開発者の表示名, description: 30文字以内。ニックネームでも構いません}
    validations: {required: true}
  - type: checkboxes
    id: agree
    attributes:
      label: 確認
      options:
        - label: 自分（または自分のチーム）が開発した作品です
          required: true
        - label: 掲載できないもの（他の人の作品、ファイルの直接配布、「稼げる」系、アダルト、ギャンブル関連、法令に違反するもの）に該当しません
          required: true
        - label: 入力内容が公開されることに同意します
          required: true
